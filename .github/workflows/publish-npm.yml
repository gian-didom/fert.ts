name: Publish Package to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libyaml-cpp-dev
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja yaml-cpp
      
      - name: Build FERT library
        run: |
          cd ..
          mkdir -p build
          cd build
          cmake -G Ninja ..
          ninja
      
      - name: Install npm dependencies
        run: npm ci
        working-directory: nodejs
      
      - name: Build native addon
        run: npm run build
        working-directory: nodejs
      
      - name: Run tests
        run: npm test
        working-directory: nodejs

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libyaml-cpp-dev
      
      - name: Build FERT library
        run: |
          cd ..
          mkdir -p build
          cd build
          cmake -G Ninja ..
          ninja
      
      - name: Install and build
        run: |
          npm ci
          npm run build
        working-directory: nodejs
      
      - name: Publish package
        run: npm publish
        working-directory: nodejs
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
